<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact • looka</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <img class="nav-logo" src="assets/images/logo.jpg">
            <ul class="nav-links">
            <li class="hover-bar"><a href="index.html">dev</a></li>
            <li class="hover-bar"><a href="projects.html">projects</a></li>
            <li class="hover-bar"><a href="resume.html">resume</a></li>
            </ul>

            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <a class="nav-cta" href="contact.html">Contact Me</a>
        </nav>
    </header>

    <main>
        <h1>Let's get to know each other ☕🌿</h1>
        <section class="contact">
            <div class="contact-email">
            <span class="contact-email-left">
                <span class="icon-email" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5L4 8V6l8 5 8-5v2Z"/>
                </svg>
                </span>

                <span id="email-text">nguyenlucasv@gmail.com</span>
            </span>

            <button type="button" class="copy-btn" aria-label="Copy email">
                <span class="icon-copy" aria-hidden="true">
                <svg class="copy-icon" viewBox="0 0 24 24" width="16" height="16">
                    <path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v12h2V3h12V1Zm4 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h12v14Z"/>
                </svg>

                <svg class="check-icon" viewBox="0 0 24 24" width="16" height="16" style="display:none;">
                    <path fill="currentColor" d="M9 16.2 4.8 12 3.4 13.4 9 19l12-12-1.4-1.4z"/>
                </svg>
                </span>
            </button>
            </div>

            <form class="contact-form" method="post" action="https://forms.un-static.com/forms/3fcf166a5cbc22194799fb70406afd3411166d02">
                <div class="contact-row">
                    <label for="name">Name</label>
                    <input id="name" name="name" placeholder="Please enter your name" type="text" required>
                </div>

                <div class="contact-row">
                    <label for="email">E-mail address</label>
                    <input id="email" name="email" placeholder="Your e-mail address" type="email" required>
                </div>

                <div class="contact-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="8" placeholder="Message here..." required></textarea>
                </div>

                <button class="contact-submit" name="submit" type="submit">Send</button>

                <p class="contact-powered"><small>(Powered by Un-static Forms)</small></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Lucas Nguyen</p>
    </footer>
    
    <script src="nav.js"></script>
    <script src="copy.js"></script>
</body>
</html>
